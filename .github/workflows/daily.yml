name: Daily NXP post
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate today's NXP post with GitHub Models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          FILE="posts/${YEAR}/${MONTH}/${DAY}.md"
          mkdir -p "$(dirname "$FILE")"

          MODEL="openai/gpt-4.1-mini"

          cat > /tmp/llm-request.json <<JSON
          {
            "model": "${MODEL}",
            "messages": [
              {
                "role": "user",
                "content": "Write a detailed technical deep-dive article for a Jekyll blog called 'NXP Wireless Daily'. Focus on an NXP wireless topic relevant to Wi-Fi, Bluetooth, Thread, Zigbee, Matter, UWB, NFC, or automotive wireless connectivity. Include clear sections: title, overview, key features, under the hood, where it shines (use cases), getting started, and takeaway. Keep it accurate, practical, and written for engineers. Use Markdown formatting only. Do not include code fences or YAML front matter. Keep it around 1200-1800 words."
              }
            ],
            "temperature": 0.7,
            "top_p": 0.9,
            "max_tokens": 4000
          }
          JSON

          curl -fsSL "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data @/tmp/llm-request.json > /tmp/llm-response.json

          python3 - "$FILE" <<'PY'
          import json
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          with open('/tmp/llm-response.json', 'r', encoding='utf-8') as fh:
              data = json.load(fh)

          choices = data.get('choices')
          if not choices:
              sys.exit('Model returned no choices: ' + json.dumps(data)[:500])

          text = choices[0]['message']['content']
          output_path.write_text(text.strip() + '\n', encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import datetime

          archive = Path('index.md')
          date = datetime.date.today().strftime('%Y-%m-%d')
          link = f"- [{date}](posts/{date[:4]}/{date[5:7]}/{date[8:10]}.md)"

          text = archive.read_text(encoding='utf-8')
          if link not in text:
              marker = '## Archive'
              idx = text.find(marker)
              if idx == -1:
                  text = text.rstrip() + '\n\n' + marker + '\n\n' + link + '\n'
              else:
                  insert_at = idx + len(marker)
                  text = text[:insert_at] + '\n\n' + link + '\n' + text[insert_at:].lstrip('\n')
              archive.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts index.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily NXP post"
          git push
