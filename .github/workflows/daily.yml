name: Daily NXP post

on:
  schedule:
    # Daily at 13:17 UTC.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nxp-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: llama-3.3-70b-versatile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate today's NXP post with Groq
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Missing GROQ_API_KEY repository secret."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import random
          import time
          import urllib.error
          import urllib.request

          today = datetime.datetime.now(
              datetime.timezone.utc
          ).date()

          date_string = today.isoformat()

          post_path = pathlib.Path(
              f"posts/{today:%Y}/{today:%m}/{today:%d}.md"
          )

          archive_path = pathlib.Path("index.md")

          def update_archive():
              link = f"- [{date_string}]({post_path.as_posix()})"

              if archive_path.exists():
                  text = archive_path.read_text(encoding="utf-8")
              else:
                  text = "# NXP Wireless Daily\n\n## Archive\n"

              if link in text:
                  print("Archive already contains today's link.")
                  return

              marker = "## Archive"
              before, found, after = text.partition(marker)

              if found:
                  text = (
                      before
                      + marker
                      + "\n\n"
                      + link
                      + "\n"
                      + after.lstrip("\n")
                  )
              else:
                  text = (
                      text.rstrip()
                      + "\n\n"
                      + marker
                      + "\n\n"
                      + link
                      + "\n"
                  )

              archive_path.write_text(text, encoding="utf-8")
              print("Updated archive.")

          # Do not regenerate an existing, nonempty daily post.
          if post_path.exists() and post_path.stat().st_size > 0:
              print(f"Today's post already exists: {post_path}")
              update_archive()
              raise SystemExit(0)

          topics = [
              "Wi-Fi connectivity architecture and integration",
              "Bluetooth LE connectivity and low-power design",
              "Thread networking and border-router architecture",
              "Zigbee networking and interoperability",
              "Matter commissioning and connectivity",
              "UWB ranging and system integration",
              "NFC reader integration and application design",
              "automotive wireless connectivity architecture",
          ]

          topic = topics[today.toordinal() % len(topics)]

          prompt = f"""
          Write a detailed technical deep-dive article for a Jekyll
          blog called "NXP Wireless Daily".

          Editorial date: {date_string}.
          Today's focus: {topic}, specifically in the context of
          NXP wireless products and engineering workflows.

          Requirements:
          - Write approximately 1200-1800 words.
          - Begin with one descriptive H1 article title.
          - Include these H2 sections:
            Overview
            Key features
            Under the hood
            Where it shines (use cases)
            Getting started
            Takeaway
          - Use Markdown only.
          - Do not include code fences or YAML front matter.
          - Write for engineers: accurate, practical, and specific.
          - Clearly distinguish wireless-standard capabilities from
            capabilities of a particular NXP device or software stack.
          - Do
